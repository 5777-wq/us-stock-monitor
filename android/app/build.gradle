plugins {
    id 'com.android.application'
}

// CI 里每次构建 versionCode/Name 取 run_number，保证每次发布都可覆盖安装升级
def ciRun = (System.getenv('GITHUB_RUN_NUMBER') ?: '0') as Integer

// 签名凭据只从 GitHub Secrets 注入的环境变量读取（2026-10-05 轮换，旧随库明文 keystore 已废弃删除）。
// 本地构建没有 Secrets 时退 debug 签名，仅供自装调试；正式 APK 一律由 CI 产出。
def ksB64 = System.getenv('ANDROID_KEYSTORE_BASE64')
def ksFile = rootProject.file('signing/release-from-secret.jks')
if (ksB64) {
    ksFile.parentFile.mkdirs()
    ksFile.setBytes(java.util.Base64.getDecoder().decode(ksB64))
}

android {
    namespace 'com.wq5777.usstockmon'
    compileSdk 34

    defaultConfig {
        applicationId 'com.wq5777.usstockmon'
        minSdk 24
        targetSdk 34
        versionCode ciRun > 0 ? ciRun : 1
        versionName ciRun > 0 ? "1.${ciRun}" : '1.0-local'
    }

    signingConfigs {
        release {
            if (ksB64) {
                storeFile ksFile
                storeType 'PKCS12'
                storePassword System.getenv('ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'usstockmon'
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksB64 ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
