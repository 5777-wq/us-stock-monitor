# 美股监控：SP500 实时市值前 100 + SPMO · 日线 RSI6 超买超卖 + Vegas 三通道
# 每周一~五 21:30 UTC（= 美东 17:30，无论夏冬令时都在收盘后）自动跑，
# 把 out/report.html + out/latest.json + out/cache 提交回仓库。
# 数据源在 Actions 网络里直连可用（东财 push2his / 腾讯），无需密钥。
name: us-monitor

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # K线缓存 [FIX-06]：命中上次 run 的缓存即走增量（120 根/只），全量 bootstrap 只在
      # 缓存丢失时发生；save 在 job 成功后自动执行，不污染 main 分支
      - name: Restore kline cache
        uses: actions/cache@v4
        with:
          path: out/cache
          key: usmon-cache-${{ github.run_id }}
          restore-keys: |
            usmon-cache-

      - name: Run monitor (101 tickers)
        run: node monitor.mjs --quiet

      - name: Offline test gate
        run: node test.mjs

      - name: Commit report if changed
        run: |
          git config user.name "us-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add out/
          if git diff --cached --quiet; then
            echo "报告无变化，跳过提交"
          else
            git commit -m "monitor: $(date -u +%F) 收盘报告 [skip ci]"
            # 监控运行期间远端可能有新提交（如另一次监控/APK入库）；out/ 冲突时取本地——
            # 本地这份永远是刚生成的最新报告
            git pull --rebase -X theirs origin main
            git push
          fi

      # 心跳 [FIX-05]：报告日落后最近收盘日 >1 交易日 → 本步骤非 0 退出 → 触发下方告警
      - name: Heartbeat check (report freshness)
        if: always()
        run: node tools/check-fresh.mjs

      # 失败告警 [FIX-05]：monitor 崩溃 / 测试挂 / 提交失败 / 心跳过期都会走到这里。
      # 三个通道按已配置的 Secrets 自动选择，未配置则跳过（echo 提示）。
      - name: Notify on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.NOTIFY_TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.NOTIFY_TELEGRAM_CHAT_ID }}
          BARK_URL: ${{ secrets.NOTIFY_BARK_URL }}
          SC_KEY: ${{ secrets.NOTIFY_SERVERCHAN_KEY }}
        run: |
          MSG="Meridian 监控失败：run $GITHUB_RUN_NUMBER（连续无新报告或运行出错），日志 https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          sent=0
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            curl -s --max-time 15 -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
              -d chat_id="$TG_CHAT" --data-urlencode "text=$MSG" && sent=1
          fi
          if [ -n "$BARK_URL" ]; then
            curl -s --max-time 15 -X POST "${BARK_URL%/}" \
              --data-urlencode "title=Meridian 监控失败" --data-urlencode "body=$MSG" && sent=1
          fi
          if [ -n "$SC_KEY" ]; then
            curl -s --max-time 15 -X POST "https://sctapi.ftqq.com/$SC_KEY.send" \
              --data-urlencode "title=Meridian 监控失败" --data-urlencode "desp=$MSG" && sent=1
          fi
          [ "$sent" = "1" ] || echo "（未配置 NOTIFY_* Secrets，跳过失败告警推送）"
