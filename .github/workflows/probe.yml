# 一次性网络诊断（手动触发）：确认 Actions 网络里各数据源的真实可达性
name: probe
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe data sources
        run: node diag/probe-cloud.mjs
