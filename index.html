<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="0;url=./out/report.html">
<link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#147d82">
<link rel="apple-touch-icon" href="./assets/pwa/apple-touch-icon.png"><link rel="icon" type="image/png" href="./assets/pwa/icon-192.png">
<script>if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('./sw.js')})</script>
<title>Meridian</title>
<style>
:root{--bg:#f2f5f6;--surface:#fff;--ink:#16232b;--muted:#708087;--line:#dce5e7;--accent:#002FA7}
@media(prefers-color-scheme:dark){:root{--bg:#11191c;--surface:#182326;--ink:#e8f0f1;--muted:#9aadb1;--line:#304348;--accent:#82A7FF}}
body{font:15px/1.7 "Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--ink);border-radius:2px;padding:30px 28px;max-width:330px;margin:20px;width:calc(100vw - 40px);box-sizing:border-box;text-align:left}
.card img{width:64px;height:64px;border-radius:4px}
h1{font-size:26px;letter-spacing:-.02em;line-height:1.15;margin:16px 0 6px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 20px}
.rule{height:2px;background:var(--ink);margin:0 0 18px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-radius:2px;text-decoration:none;font-weight:700;font-size:14px;margin-top:10px;transition:filter .15s,transform .15s}
.btn:active{transform:scale(.98);transition:none}
.btn-open{background:var(--accent);color:#fff}
.btn-apk{border:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:650}
.btn-apk svg{width:17px;height:17px;flex:0 0 auto}
.arr{font-weight:750}
.tip{color:var(--muted);font-size:11px;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
@keyframes tg-in{from{opacity:0;transform:translateY(10px)}}
.card{animation:tg-in .35s cubic-bezier(.38,.7,.125,1) both}
@media(prefers-reduced-motion:reduce){.card{animation:none}.btn,.btn:active{transition:none;transform:none}}
</style>
</head><body>
<div class="card">
<img src="./assets/pwa/icon-192.png" alt="Meridian">
<h1>Meridian</h1>
<p class="sub">美股收盘信号台 · SP500 前150 + SPMO<br>日/周线 RSI6 · Vegas 三通道 · 每个交易日收盘后自动更新</p>
<div class="rule"></div>
<a class="btn btn-open" href="./out/report.html"><span>进入今日报告</span><span class="arr">→</span></a>
<a class="btn btn-apk" href="./app/us-stock-monitor.apk" download><span>下载安卓 App（免开网页）</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7.5" y="3" width="9" height="18" rx="2.5"/><path d="M12 7.5V14"/><path d="M10 12l2 2 2-2"/><path d="M10.5 18.5h3"/></svg></a>
<div class="tip">手机浏览器打开本站 → 菜单「添加到主屏幕」，也能当 App 用</div>
</div>
</body></html>
